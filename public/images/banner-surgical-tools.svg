<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" fill="none">
  <!-- Gradient Cyan Blue Background -->
  <defs>
    <linearGradient id="cyan-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="450" fill="url(#cyan-bg)"/>

  <!-- Left Lotus Floral Pattern (Watermark style) -->
  <g transform="translate(180, 225)" opacity="0.4">
    <!-- Outer Lotus Petals -->
    <path d="M0 0 Q-60 -120 0 -200 Q60 -120 0 0 Z" fill="#0284C7"/>
    <path d="M0 0 Q-120 -60 -200 0 Q-120 60 0 0 Z" fill="#0284C7"/>
    <path d="M0 0 Q60 -120 140 -140 Q120 -40 0 0 Z" fill="#0369A1"/>
    <path d="M0 0 Q-60 -120 -140 -140 Q-120 -40 0 0 Z" fill="#0369A1"/>
    <path d="M0 0 Q80 20 120 80 Q20 80 0 0 Z" fill="#0284C7"/>
    <path d="M0 0 Q-80 20 -120 80 Q-20 80 0 0 Z" fill="#0284C7"/>
    <!-- Caduceus Twist in Center -->
    <path d="M0 -150 Q-30 -100 0 -50 Q30 0 0 50 Q-30 100 0 150" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M0 -150 Q30 -100 0 -50 Q-30 0 0 50 Q30 100 0 150" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  </g>

  <!-- Title Text -->
  <text x="500" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="2">PRECISION SURGICAL &amp; MEDICAL INSTRUMENTS</text>
  <text x="500" y="115" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="18" fill="#E0F2FE" letter-spacing="1">German Stainless Steel • CE &amp; ISO Certified Quality</text>

  <!-- Right Side Surgical Instruments Illustration (Scissors, Forceps, Clamps) -->
  <g transform="translate(750, 240)">
    <!-- Surgical Scissors 1 -->
    <g transform="rotate(-30)">
      <path d="M-150 -10 L100 -2 M-150 10 L100 2" stroke="url(#metal-grad)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="-165" cy="-18" r="16" fill="none" stroke="url(#metal-grad)" stroke-width="8"/>
      <circle cx="-165" cy="18" r="16" fill="none" stroke="url(#metal-grad)" stroke-width="8"/>
      <circle cx="0" cy="0" r="6" fill="#475569"/>
    </g>

    <!-- Forceps 2 -->
    <g transform="translate(120, -60) rotate(15)">
      <path d="M-100 -8 L80 -3 L120 -1 M-100 8 L80 3 L120 1" stroke="url(#metal-grad)" stroke-width="10"/>
      <path d="M-100 -8 C-110 -8 -110 8 -100 8" stroke="url(#metal-grad)" stroke-width="10" fill="none"/>
    </g>

    <!-- Hemostat Clamp 3 -->
    <g transform="translate(-80, 80) rotate(45)">
      <path d="M-120 -12 L60 -3 M-120 12 L60 3" stroke="url(#metal-grad)" stroke-width="10"/>
      <circle cx="-135" cy="-20" r="15" fill="none" stroke="#0284C7" stroke-width="8"/>
      <circle cx="-135" cy="20" r="15" fill="none" stroke="url(#metal-grad)" stroke-width="8"/>
      <circle cx="0" cy="0" r="5" fill="#334155"/>
    </g>
  </g>
</svg>
