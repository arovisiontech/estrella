<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" fill="none">
  <!-- Background with grey wavy dynamic curves -->
  <rect width="1200" height="450" fill="#60676E"/>
  <path d="M0 0 L1200 0 L1200 450 L0 450 Z" fill="#666D74"/>
  <path d="M0 100 Q 200 0, 450 180 T 900 120 Q 1100 250, 1200 150 L 1200 450 L 0 450 Z" fill="#52585E"/>
  <path d="M0 250 Q 300 400, 600 220 T 1200 380 L 1200 450 L 0 450 Z" fill="#44494E"/>

  <!-- Title "Our Values" -->
  <text x="1150" y="80" text-anchor="end" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#FFFFFF" letter-spacing="1">Our Values</text>

  <!-- 6 Values Icons and Labels -->

  <!-- 1. Quality and Craftsmanship (Top Left) -->
  <g transform="translate(130, 180)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Diamond -->
    <path d="M0 -20 L16 -6 L0 20 L-16 -6 Z" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M-16 -6 H16 M-8 -6 L0 -20 L8 -6 M-8 -6 L0 20 L8 -6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="48" x2="0" y2="90" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="90" r="4" fill="#FFFFFF"/>
    <text x="0" y="115" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Quality</text>
    <text x="0" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">and Craftsmanship</text>
  </g>

  <!-- 2. Delivering on our Promises (Bottom Left) -->
  <g transform="translate(290, 310)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Handshake -->
    <path d="M-20 0 L-10 -10 L0 -5 L10 -10 L20 0 L10 10 L0 5 L-10 10 Z" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="0" y1="-48" x2="0" y2="-90" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="-90" r="4" fill="#FFFFFF"/>
    <text x="0" y="-120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Delivering</text>
    <text x="0" y="-100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">on our Promises</text>
  </g>

  <!-- 3. Honesty and fairness (Top Middle) -->
  <g transform="translate(470, 180)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Hand with Checkmark -->
    <path d="M-15 8 C-10 8, -5 12, 0 12 C10 12, 18 5, 20 -2" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M-8 -10 L-2 -3 L12 -15" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="48" x2="0" y2="90" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="90" r="4" fill="#FFFFFF"/>
    <text x="0" y="115" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Honesty</text>
    <text x="0" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">and fairness</text>
  </g>

  <!-- 4. Pleasing all of our customers (Bottom Middle) -->
  <g transform="translate(650, 310)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- People Group -->
    <circle cx="0" cy="-12" r="8" fill="#FFFFFF"/>
    <path d="M-14 12 C-14 0, 14 0, 14 12" fill="#FFFFFF"/>
    <circle cx="-16" cy="-6" r="6" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="16" cy="-6" r="6" fill="#FFFFFF" opacity="0.8"/>
    <line x1="0" y1="-48" x2="0" y2="-90" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="-90" r="4" fill="#FFFFFF"/>
    <text x="0" y="-120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Pleasing all of</text>
    <text x="0" y="-100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">our customers</text>
  </g>

  <!-- 5. Employee growth and development (Top Right) -->
  <g transform="translate(830, 180)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Stairs with Person -->
    <path d="M-22 18 H-10 V8 H2 V-2 H14 V-12 H24" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="4" cy="-20" r="5" fill="#FFFFFF"/>
    <path d="M-1 -12 L4 -7 L9 -12 M4 -7 V2" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="48" x2="0" y2="90" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="90" r="4" fill="#FFFFFF"/>
    <text x="0" y="115" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Employee growth</text>
    <text x="0" y="135" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">and development</text>
  </g>

  <!-- 6. Teamwork and Collaboration (Bottom Right) -->
  <g transform="translate(1010, 310)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Circular Collaboration Network -->
    <circle cx="0" cy="-16" r="5" fill="#FFFFFF"/>
    <circle cx="16" cy="10" r="5" fill="#FFFFFF"/>
    <circle cx="-16" cy="10" r="5" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="0" y1="-48" x2="0" y2="-90" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="-90" r="4" fill="#FFFFFF"/>
    <text x="0" y="-120" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Teamwork and</text>
    <text x="0" y="-100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">Collaboration</text>
  </g>
</svg>
