<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" fill="none">
  <!-- Dark Navy Blue Background -->
  <rect width="1200" height="450" fill="#0A192F"/>
  <rect x="0" y="160" width="480" height="180" fill="#000000" opacity="0.6"/>

  <!-- Left Text "DESIGN YOUR OWN" -->
  <g transform="translate(40, 200)">
    <text x="0" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="url(#metal-text)" letter-spacing="3">DESIGN YOUR</text>
    <text x="0" y="110" font-family="'Impact', 'Arial Black', sans-serif" font-size="78" font-weight="900" fill="url(#metal-text)" letter-spacing="4">OWN</text>
    
    <text x="0" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-style="italic" fill="#E2E8F0" max-width="400">
      Optimise your impact by creating a
    </text>
    <text x="0" y="168" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-style="italic" fill="#E2E8F0">
      one of a kind custom design
    </text>
    <text x="0" y="191" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-style="italic" fill="#38BDF8">
      through sublimation printing
    </text>
  </g>

  <defs>
    <linearGradient id="metal-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="jersey-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="jersey-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="jersey-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <!-- Right Side Sports Uniforms Illustration -->
  <g transform="translate(520, 40)">

    <!-- Uniform 1: Blue Sublimation Basketball Kit -->
    <g transform="translate(0, 30)">
      <!-- Jersey -->
      <path d="M40 20 L25 50 L50 60 L60 220 H140 L150 60 L175 50 L160 20 Q100 45 40 20 Z" fill="url(#jersey-blue)" stroke="#FFFFFF" stroke-width="2"/>
      <text x="100" y="130" text-anchor="middle" font-family="'Impact', sans-serif" font-size="44" fill="#FFFFFF">10</text>
      <!-- Shorts -->
      <path d="M55 220 H145 L155 340 L105 340 L100 260 L95 340 L45 340 Z" fill="url(#jersey-blue)" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Uniform 2: Gold & Black Football Uniform -->
    <g transform="translate(130, 40)">
      <!-- Jersey -->
      <path d="M40 20 L15 65 L45 75 L55 220 H145 L155 75 L185 65 L160 20 Q100 45 40 20 Z" fill="url(#jersey-gold)" stroke="#1E293B" stroke-width="2"/>
      <text x="100" y="130" text-anchor="middle" font-family="'Impact', sans-serif" font-size="44" fill="#000000">7</text>
      <!-- Pants -->
      <path d="M55 220 H145 L140 370 H105 L100 280 L95 370 H60 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    </g>

    <!-- Uniform 3: Black Sponsor Jersey -->
    <g transform="translate(270, 40)">
      <path d="M40 20 L15 65 L45 75 L55 220 H145 L155 75 L185 65 L160 20 Q100 45 40 20 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="2"/>
      <text x="100" y="110" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="900" font-size="20" fill="#38BDF8">Sponsor</text>
      <!-- Shorts -->
      <path d="M55 220 H145 L155 340 L105 340 L100 260 L95 340 L45 340 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="2"/>
      <text x="130" y="310" text-anchor="middle" font-family="'Impact', sans-serif" font-size="28" fill="#FFFFFF">10</text>
    </g>

    <!-- Uniform 4: Red & Black Sublimation Jersey -->
    <g transform="translate(410, 40)">
      <path d="M40 20 L15 65 L45 75 L55 220 H145 L155 75 L185 65 L160 20 Q100 45 40 20 Z" fill="url(#jersey-red)" stroke="#000000" stroke-width="2"/>
      <!-- Pattern overlays -->
      <path d="M55 60 L145 180 M55 120 L100 180" stroke="#000000" stroke-width="6"/>
      <!-- Shorts -->
      <path d="M55 220 H145 L155 340 L105 340 L100 260 L95 340 L45 340 Z" fill="url(#jersey-red)" stroke="#000000" stroke-width="2"/>
    </g>

  </g>
</svg>
